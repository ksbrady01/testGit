<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="MySteps helps every person at Central Union know where they are, what's next, and how to grow."><script>window.MYSTEPS_API="/api/submit";window.MYSTEPS_PROFILE_API="/api/profile";</script><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>MySteps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky glass header, full-bleed cinematic bands with inner gutters, bento card grid, two-pane wizard (timeline rail + question panel). */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#E9EBF3; --ink:#12152B; --muted:#576078;
  --line:#D8DCE8; --accent:#A8620A; --accent-soft:#F7E6C8; --btn:#F0A92E; --on-btn:#1B1306;
  --indigo:#3240A0; --indigo-soft:#E3E6FA; --ok:#1F7A55; --danger:#B3261E;
  --glass:rgba(243,244,248,.78);
  --shadow:0 1px 2px rgba(18,21,43,.06),0 14px 36px -14px rgba(18,21,43,.22);
  --scene-ink:#FFFFFF; --scene-muted:rgba(255,255,255,.78);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0D19; --surface:#121629; --surface-2:#1A1F36; --ink:#ECEEF7; --muted:#9BA1BC;
  --line:#262C47; --accent:#F4BA55; --accent-soft:#3A2C12; --btn:#F4B648; --on-btn:#1B1306;
  --indigo:#9AA6FF; --indigo-soft:#1E2448; --ok:#5BD49B; --danger:#FF8A80;
  --glass:rgba(10,13,25,.72);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -16px rgba(0,0,0,.7);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0A0D19; --surface:#121629; --surface-2:#1A1F36; --ink:#ECEEF7; --muted:#9BA1BC;
  --line:#262C47; --accent:#F4BA55; --accent-soft:#3A2C12; --btn:#F4B648; --on-btn:#1B1306;
  --indigo:#9AA6FF; --indigo-soft:#1E2448; --ok:#5BD49B; --danger:#FF8A80;
  --glass:rgba(10,13,25,.72);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -16px rgba(0,0,0,.7);
  color-scheme:dark;}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background .4s var(--ease),color .4s var(--ease)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--glass)}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--btn);outline-offset:3px;border-radius:8px}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.tabular{font-variant-numeric:tabular-nums}

/* Header */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--glass);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.brand-word{font-family:var(--font-display);font-size:22px;font-weight:500;letter-spacing:-.02em}
.brand-word b{font-weight:800;color:var(--accent)}
.brand small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line);padding-left:10px;margin-left:2px}
.nav{display:flex;gap:4px}
.nav a{text-decoration:none;font-size:14px;font-weight:500;color:var(--muted);padding:8px 12px;border-radius:999px;transition:color .2s,background .2s}
.nav a:hover{color:var(--ink);background:var(--surface-2)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.icon-btn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;transition:transform .3s var(--ease),border-color .2s}
.icon-btn:hover{transform:rotate(-14deg);border-color:var(--accent)}
.icon-btn svg{width:18px;height:18px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;text-decoration:none;font-weight:600;font-size:15px;border-radius:999px;padding:13px 22px;transition:transform .25s var(--ease),box-shadow .25s,background .2s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--btn);color:var(--on-btn);box-shadow:0 8px 24px -10px rgba(240,169,46,.8)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 30px -12px rgba(240,169,46,.9)}
.btn-sm{padding:9px 16px;font-size:14px}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-scene{background:rgba(255,255,255,.12);color:var(--scene-ink);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(6px)}
.btn-scene:hover{background:rgba(255,255,255,.2)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn svg{width:16px;height:16px}

/* Scenes */
.scene{position:absolute;inset:0;width:100%;height:100%;display:block;max-width:none}
.scene.photo{object-fit:cover;filter:contrast(1.06) saturate(1.08)}
.card:hover .scene.photo{filter:contrast(1.08) saturate(1.2)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,8,20,.05) 0%,rgba(6,8,20,.15) 40%,rgba(6,8,20,.82) 100%)}

/* Page enter */
.page{animation:pageIn .7s var(--ease) both}
@keyframes pageIn{from{opacity:.0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .8s var(--ease) both}
@keyframes rise{from{opacity:.0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* Hero */
.hero{position:relative;overflow:hidden;color:var(--scene-ink);isolation:isolate}
.hero .scene{animation:kenburns 40s ease-in-out infinite alternate;transform-origin:62% 60%}
@keyframes kenburns{from{transform:scale(1.02)}to{transform:scale(1.14) translate(-1%,-1%)}}
.hero .shade{background:linear-gradient(90deg,rgba(6,8,20,.78) 0%,rgba(6,8,20,.45) 45%,rgba(6,8,20,.05) 80%),linear-gradient(180deg,transparent 55%,rgba(6,8,20,.55))}
.hero-in{position:relative;padding-block:clamp(56px,9vw,112px) clamp(48px,7vw,88px)}
.hero h1{font-size:clamp(40px,6.6vw,84px);font-weight:700;max-width:12ch;margin-top:14px}
.hero h1 em{font-style:normal;color:#FFC867}
.hero .eyebrow{color:#FFD796}
.hero .lede{font-size:clamp(16px,1.6vw,19px);max-width:52ch;color:var(--scene-muted);margin-top:20px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.letterbox{position:absolute;left:0;right:0;height:10px;background:#000;opacity:.0}

/* Bento cards */
.section{padding-block:clamp(36px,5vw,64px)}
.section-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:24px}
.section-head h2{font-size:clamp(26px,3vw,36px)}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.card{position:relative;overflow:hidden;border-radius:var(--r-lg);min-height:340px;color:var(--scene-ink);text-decoration:none;isolation:isolate;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:flex-end;transform:translateZ(0)}
.card .scene{transition:transform 1.4s var(--ease),filter .8s}
.card:hover .scene,.card:focus-visible .scene{transform:scale(1.07);filter:saturate(1.15)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.16) 48%,transparent 62%);transform:translateX(-120%);transition:transform 1.1s var(--ease);pointer-events:none}
.card:hover::after{transform:translateX(120%)}
.card-body{position:relative;padding:26px;display:grid;gap:8px}
.card-tag{display:inline-flex;align-self:start;justify-self:start;gap:6px;align-items:center;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px)}
.card h3{font-size:clamp(26px,2.6vw,34px);font-weight:700}
.card p{color:var(--scene-muted);max-width:44ch;font-size:15px}
.card-go{position:absolute;top:22px;right:22px;width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px);transition:transform .5s var(--ease),background .3s}
.card:hover .card-go{transform:rotate(-45deg);background:#FFC867;color:#1B1306}
.card-go svg{width:18px;height:18px}
.c-7{grid-column:span 7}.c-5{grid-column:span 5}
.card.feature{min-height:400px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:18px}
.strip-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:20px;display:grid;gap:4px}
.strip-item strong{font-family:var(--font-display);font-size:30px;font-weight:700}
.strip-item span{color:var(--muted);font-size:14px}

/* About */
.page-hero{position:relative;overflow:hidden;color:var(--scene-ink);isolation:isolate}
.page-hero .shade{background:linear-gradient(180deg,rgba(6,8,20,.25),rgba(6,8,20,.82))}
.page-hero-in{position:relative;padding-block:clamp(64px,9vw,120px) clamp(36px,5vw,56px)}
.page-hero h1{font-size:clamp(36px,5vw,64px);font-weight:700;max-width:18ch;margin-top:12px}
.page-hero p.lede{color:var(--scene-muted);max-width:58ch;margin-top:16px;font-size:17px}
.page-hero .eyebrow{color:#FFD796}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.trio article{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px;display:grid;gap:10px;align-content:start}
.trio h3{font-size:24px}
.trio .q{font-family:var(--font-display);font-size:15px;color:var(--accent);font-weight:600}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;position:relative;margin-top:8px}
.flow li{list-style:none;padding:0 18px 0 0;display:grid;gap:8px;align-content:start;position:relative}
.flow-dot{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;background:var(--accent-soft);color:var(--accent);position:relative;z-index:1}
.flow li::before{content:"";position:absolute;top:22px;left:44px;right:0;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 12px)}
.flow li:last-child::before{display:none}
.flow h4{font-size:18px;margin-top:6px}
.flow p{color:var(--muted);font-size:14.5px}
.flow-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px}
.scripture{border-left:3px solid var(--accent);padding:6px 0 6px 18px;margin-top:28px;font-family:var(--font-display);font-size:clamp(19px,2vw,24px);max-width:46ch}
.scripture cite{display:block;font-family:var(--font-body);font-style:normal;font-size:13px;color:var(--muted);margin-top:8px;letter-spacing:.06em}

/* Teams */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:22px}
.search{flex:1 1 240px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 16px;height:46px;transition:border-color .2s}
.search:focus-within{border-color:var(--accent)}
.search input{border:0;outline:0;background:transparent;flex:1;font:inherit;color:var(--ink);min-width:0}
.search svg{width:18px;height:18px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s var(--ease);display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.6;font-variant-numeric:tabular-nums}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.team{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:20px;display:grid;gap:10px;align-content:start;transition:transform .35s var(--ease),box-shadow .35s,border-color .3s;animation:rise .6s var(--ease) both;position:relative}
.team:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:transparent}
.team-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.type{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.type.t-serving{background:var(--accent-soft);color:var(--accent)}
.type.t-small{background:var(--indigo-soft);color:var(--indigo)}
.type.t-assist{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.team h3{font-size:20px;font-weight:650}
.team p{color:var(--muted);font-size:14.5px}
.area{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.area i{width:8px;height:8px;border-radius:99px;background:var(--accent);display:inline-block}
.fitpill{font-size:12px;font-weight:700;color:var(--on-btn);background:var(--btn);padding:4px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.empty{padding:48px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r-md)}

/* Wizard */
.wizard-head{padding-block:clamp(28px,4vw,44px) 20px;display:grid;gap:10px}
.wizard-head h1{font-size:clamp(28px,3.6vw,44px);font-weight:700}
.wizard-head p{color:var(--muted);max-width:66ch}
.wizard{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;padding-bottom:56px;align-items:start}
.timeline{position:sticky;top:calc(84px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 18px}
.tl-title{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 14px 6px;display:flex;justify-content:space-between}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl-rail{position:absolute;left:21px;top:20px;bottom:20px;width:2px;background:var(--line);border-radius:2px;overflow:hidden}
.tl-fill{position:absolute;left:0;top:0;width:100%;background:linear-gradient(var(--btn),var(--accent));transition:height .8s var(--ease)}
.tl li{position:relative}
.tl button{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;padding:8px 6px;border-radius:12px;text-align:left;cursor:pointer;transition:background .2s}
.tl button:hover:not([disabled]){background:var(--surface-2)}
.tl button[disabled]{cursor:default}
.tl-node{flex:none;width:32px;height:32px;border-radius:999px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--surface);border:2px solid var(--line);color:var(--muted);transition:all .45s var(--ease);position:relative;z-index:1;font-variant-numeric:tabular-nums}
.tl-node svg{width:15px;height:15px}
.tl li.done .tl-node{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tl li.current .tl-node{border-color:var(--btn);color:var(--ink);box-shadow:0 0 0 6px color-mix(in srgb,var(--btn) 22%,transparent);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--btn) 8%,transparent)}}
.tl-text{display:grid;line-height:1.25;min-width:0}
.tl-text b{font-size:14.5px;font-weight:600}
.tl-text small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl li.upcoming .tl-text b{color:var(--muted);font-weight:500}
.tl-foot{margin-top:16px;padding:14px 6px 0;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.tl-foot svg{width:16px;height:16px;flex:none}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;min-width:0;display:flex;flex-direction:column;min-height:540px}
.mprog{display:none;padding:16px 20px 0}
.mprog-bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.mprog-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--btn),var(--accent));border-radius:99px;transition:width .7s var(--ease)}
.mprog-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
.stage{position:relative;flex:1;padding:clamp(22px,3.4vw,40px);overflow:hidden}
.step{display:grid;gap:22px}
.in-fwd{animation:inFwd .6s var(--ease) both}
.in-back{animation:inBack .6s var(--ease) both}
@keyframes inFwd{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}
.step-head{display:grid;gap:8px}
.step-head h2{font-size:clamp(24px,2.8vw,34px);font-weight:700}
.step-head .hint{color:var(--muted);font-size:15px}
.counter{font-size:13px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}

.field{display:grid;gap:6px}
.field label{font-size:13.5px;font-weight:600}
.field label span{color:var(--muted);font-weight:400}
.input,textarea.input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:13px 14px;transition:border-color .2s,box-shadow .2s;outline:0}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--btn) 20%,transparent)}
.input.bad{border-color:var(--danger)}
textarea.input{min-height:150px;resize:vertical;line-height:1.5}
.err{color:var(--danger);font-size:13px;font-weight:500}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px;cursor:pointer;transition:border-color .2s,background .25s,transform .25s var(--ease);animation:rise .5s var(--ease) both;min-width:0}
.opt:hover:not([disabled]){border-color:color-mix(in srgb,var(--accent) 60%,var(--line));transform:translateY(-2px)}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.opt-text{display:grid;min-width:0;font-size:15px;line-height:1.35}
.opt-text small{color:var(--muted);font-size:13px}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;transition:all .3s var(--ease);background:var(--surface)}
.box.round{border-radius:99px}
.opt[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--surface);animation:pop .4s var(--ease)}
.box svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:all .3s var(--ease)}
.opt[aria-checked="true"] .box svg{opacity:1;transform:none}
@keyframes pop{40%{transform:scale(1.25)}}
.gift-grid{display:flex;flex-wrap:wrap;gap:10px}
.gift{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:11px 18px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .25s var(--ease);animation:rise .5s var(--ease) both}

const joinList = (a) => a.length<=1 ? (a[0]||'') : a.slice(0,-1).join(', ') + ' and ' + a[a.length-1];

function scoreTeams(a){
  const text = (' '+(a.skills||'')+' ').toLowerCase();
  const scored = TEAMS.map(t => {
    let s = 0; const why = [];
    t.min.forEach(m => { if (a.ministries.includes(m) && m!=='fit') { s += 3.5; why.push(`your interest in ${MIN_MAP[m].label}`); } });
    t.enjoy.forEach(e => { if (a.enjoy.includes(e)) { s += 2; why.push(`your love of ${ENJOY_MAP[e].short}`); } });
    t.gifts.forEach(g => { if (a.gifts.includes(g)) { s += 2.5; why.push(`your gift of ${GIFT_MAP[g].label.toLowerCase()}`); } });
    const hits = t.kw.filter(k => text.includes(k));
    if (hits.length) { s += Math.min(hits.length,2)*1.5; why.push('what you shared about your skills'); }
    if (a.freq==='events' && t.rhythm==='events') s += 1;
    if (a.freq==='weekly' && t.rhythm==='weekly') s += .75;
    if ((a.freq==='monthly'||a.freq==='twice') && t.rhythm==='monthly') s += .75;
    return { ...t, score:s, why };
  }).sort((x,y) => y.score - x.score);
  const max = scored[0].score || 1;
  return scored.map(t => ({ ...t, pct: Math.round(58 + 40 * (t.score / max)) - (t.score===0?20:0) }));
}

function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

let NOISE=null;
function noiseTile(){
  if (NOISE) return NOISE;
  const c=document.createElement('canvas'); c.width=c.height=160; const x=c.getContext('2d'); const d=x.createImageData(160,160);
  for(let i=0;i<d.data.length;i+=4){ const v=Math.random()*255; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255; }
  x.putImageData(d,0,0); NOISE=c; return c;
}
function finish(ctx,w,h,vig=.6,grainA=.09){

  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,`rgba(0,0,0,${vig})`);
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  ctx.save(); ctx.globalAlpha=grainA; ctx.globalCompositeOperation='overlay';
  ctx.fillStyle=ctx.createPattern(noiseTile(),'repeat'); ctx.fillRect(0,0,w,h); ctx.restore();
}
function ridge(ctx,w,h,base,amp,R,fill){
  const p=[R()*10,R()*10,R()*10], f=[1.2+R()*1.5,3.5+R()*3,10+R()*8];
  ctx.beginPath(); ctx.moveTo(0,h);

function person(ctx,x,y,s,color){
  ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y-s*.9,s*.1,0,Math.PI*2); ctx.fill();

  ctx.lineTo(x-s*.02,y); ctx.lineTo(x-s*.07,y); ctx.lineTo(x-s*.11,y-s*.4); ctx.closePath(); ctx.fill();
}

const PHOTOS = {
  'dawn-3':  { src:'photos/hero.jpg',    pos:'center 55%' },
  'dawn-11': { src:'photos/path.jpg',    pos:'center 45%' },
  'stage-5': { src:'photos/worship.jpg', pos:'center 40%' },
  'stars-9': { src:'photos/stars.jpg',   pos:'center 60%' },
  'stones-4':{ src:'photos/stones.jpg',  pos:'center 65%' },
};
function Scene({ kind, seed=1 }){
  const photo = PHOTOS[kind+'-'+seed];
  const [failed, setFailed] = useState(false);
  if (photo && !failed) return <img className="scene photo" src={photo.src} alt="" aria-hidden="true" decoding="async" style={{objectPosition:photo.pos}} onError={() => setFailed(true)}/>;
  return <PaintedScene kind={kind} seed={seed}/>;
}
function PaintedScene({ kind, seed=1 }){
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current; let raf = 0, lw = 0, lh = 0;
    const draw = () => {
      const r = c.getBoundingClientRect(); const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = Math.max(2, Math.round(r.width * dpr)), h = Math.max(2, Math.round(r.height * dpr));
      if (Math.abs(w-lw) < 8 && Math.abs(h-lh) < 8) return;
      lw = w; lh = h; c.width = w; c.height = h;
      PAINTERS[kind](c.getContext('2d'), w, h, seed);
    };
    draw();
    const ro = new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); });
    ro.observe(c);
    return () => { ro.disconnect(); cancelAnimationFrame(raf); };
  }, [kind, seed]);
  return <canvas ref={ref} className="scene" aria-hidden="true" />;
}

function useTheme(){
  const [theme, setTheme] = useState(() => {
    const saved = store.get('mysteps.theme');
    if (saved === 'light' || saved === 'dark') return saved;
    return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  });
  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); store.set('mysteps.theme', theme); }, [theme]);
  return [theme, () => setTheme(t => t === 'dark' ? 'light' : 'dark')];
}

/* ───────────────────────── Wizard ───────────────────────── */
const STEPS = [
  { key:'contact', label:'About you' },
  { key:'enjoy', label:'What you enjoy' },
  { key:'gifts', label:'Spiritual gifts' },
  { key:'skills', label:'Skills & interests' },
  { key:'ministries', label:'Ministries' },
  { key:'freq', label:'How often' },
  { key:'followUp', label:'Next step' },
];
const EMPTY = { name:'', email:'', phone:'', hp:'', enjoy:[], gifts:[], skills:'', ministries:[], freq:'', followUp:'' };
const emailOk = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());

function validate(step, a){
  const e = {};
  if (step===0){ if (!a.name.trim()) e.name='Enter your name.'; if (!emailOk(a.email)) e.email='Enter an email like name@example.com.'; if (a.phone && a.phone.replace(/\D/g,'').length < 7) e.phone='Enter a full phone number, or leave it blank.'; }
  if (step===1 && !a.enjoy.length) e.form='Choose at least one thing you enjoy.';
  if (step===2 && !a.gifts.length) e.form='Choose at least one gift, or “I’m still discovering my gifts.”';
  if (step===4 && !a.ministries.length) e.form='Choose at least one ministry, or “Help me find my fit.”';
  if (step===5 && !a.freq) e.form='Choose how often you could serve.';
  if (step===6 && !a.followUp) e.form='Choose Yes or No.';
  return e;
}
function summary(step, a){
  switch(STEPS[step].key){
    case 'contact': return a.name || 'Name and contact';
    case 'enjoy': return a.enjoy.length ? `${a.enjoy.length} selected` : 'Select all that apply';
    case 'gifts': return a.gifts.length ? a.gifts.map(g => GIFT_MAP[g].label.replace('I’m still discovering my gifts','Discovering')).join(', ') : 'Up to three';
    case 'skills': return a.skills ? 'Shared' : 'Optional';
    case 'ministries': return a.ministries.length ? `${a.ministries.length} selected` : 'Select all that apply';
    case 'freq': return a.freq ? FREQ_MAP[a.freq].label : 'Choose one';
    case 'followUp': return a.followUp ? (a.followUp==='yes' ? 'Yes, reach out' : 'No thanks') : 'Yes or No';
  }
}

function Check({ checked, round }){ return <span className={'box'+(round?' round':'')}>{I.check}</span>; }

function Wizard({ onSubmit }){
  const [a, setA] = useState(() => ({ ...EMPTY, ...(store.get('mysteps.draft') || {}) }));
  const [step, setStep] = useState(0);
  const [maxStep, setMaxStep] = useState(0);
  const [dir, setDir] = useState(1);
  const [errors, setErrors] = useState({});
  const stageRef = useRef(null);
  useEffect(() => { store.set('mysteps.draft', a); }, [a]);

  const set = (patch) => { setA(prev => ({ ...prev, ...patch })); setErrors({}); };
  const toggle = (field, id, max) => {
    setA(prev => {
      let list = prev[field];
      if (list.includes(id)) list = list.filter(x => x!==id);
      else if (field==='gifts' && id==='discovering') list = ['discovering'];
      else { list = list.filter(x => !(field==='gifts' && x==='discovering')); if (max && list.length >= max) return prev; list = [...list, id]; }
      return { ...prev, [field]: list };
    });
    setErrors({});
  };
  const goTo = (n) => { setDir(n > step ? 1 : -1); setStep(n); setErrors({}); const top = stageRef.current; if (top && top.getBoundingClientRect().top < 60) window.scrollTo({ top: window.scrollY + top.getBoundingClientRect().top - 90, behavior:'smooth' }); };
  const next = () => {
    const e = validate(step, a); if (Object.keys(e).length) { setErrors(e); return; }
    if (step === STEPS.length-1) { store.del('mysteps.draft'); onSubmit(a); return; }
    const n = step+1; setMaxStep(m => Math.max(m, n)); goTo(n);
  };
  const back = () => step > 0 && goTo(step-1);
  const onKey = (e) => { if (e.key==='Enter' && e.target.tagName==='INPUT') { e.preventDefault(); next(); } };
  const progress = step / (STEPS.length-1);
  const giftsFull = a.gifts.filter(g => g!=='discovering').length >= 3;

  const body = () => {
    switch(step){
      case 0: return (
        <div className="step">
          <div className="step-head"><p className="eyebrow">Question 1</p><h2>Name and contact information</h2><p className="hint">So someone from CU can connect with you about your next step.</p></div>
          <div className="field"><label htmlFor="f-name">Name</label><input id="f-name" className={'input'+(errors.name?' bad':'')} autoComplete="name" value={a.name} onChange={e => set({name:e.target.value})} placeholder="First and last name"/>{errors.name && <span className="err">{errors.name}</span>}</div>
          <div className="grid-2">
            <div className="field"><label htmlFor="f-email">Email</label><input id="f-email" type="email" className={'input'+(errors.email?' bad':'')} autoComplete="email" value={a.email} onChange={e => set({email:e.target.value})} placeholder="name@example.com"/>{errors.email && <span className="err">{errors.email}</span>}</div>
            <div className="field"><label htmlFor="f-phone">Phone number <span>(optional)</span></label><input id="f-phone" type="tel" className={'input'+(errors.phone?' bad':'')} autoComplete="tel" value={a.phone} onChange={e => set({phone:e.target.value})} placeholder="(555) 555-0123"/>{errors.phone && <span className="err">{errors.phone}</span>}</div>
          </div>
          <div aria-hidden="true" style={{position:'absolute',left:'-9999px',width:1,height:1,overflow:'hidden'}}>
            <label htmlFor="f-website">Leave this field empty</label>
            <input id="f-website" tabIndex={-1} autoComplete="off" value={a.hp} onChange={e => set({hp:e.target.value})}/>
          </div>
        </div>);
      case 1: return (
        <div className="step">
          <div className="step-head"><p className="eyebrow">Question 2</p><h2>What do you naturally enjoy doing?</h2><p className="hint">Select all that apply. <span className="counter">{a.enjoy.length} selected</span></p></div>
          <div className="grid-2" role="group" aria-label="What you enjoy">
            {ENJOY.map((o,i) => (
              <button key={o.id} type="button" role="checkbox" aria-checked={a.enjoy.includes(o.id)} className="opt" style={{animationDelay:i*.03+'s'}} onClick={() => toggle('enjoy', o.id)}>
                <Check/><span className="opt-text">{o.label}</span>
              </button>))}
          </div>
        </div>);
      case 2: return (
        <div className="step">
          <div className="step-head"><p className="eyebrow">Question 3</p><h2>Which spiritual gifts do you see in yourself?</h2>
            <div className="slots" aria-live="polite"><span className="hint">Choose up to three.</span>{[0,1,2].map(i => <span key={i} className={'slot'+(i < a.gifts.filter(g=>g!=='discovering').length || a.gifts.includes('discovering') ? ' on':'')}/>)}<span className="counter">{a.gifts.includes('discovering') ? 'Discovering' : `${a.gifts.length} of 3`}</span></div>
          </div>
          <div className="gift-grid" role="group" aria-label="Spiritual gifts">
            {GIFTS.map((g,i) => { const on = a.gifts.includes(g.id); const dis = !on && giftsFull && g.id!=='discovering';
              return <button key={g.id} type="button" role="checkbox" aria-checked={on} disabled={dis} className="gift" style={{animationDelay:i*.03+'s'}} onClick={() => toggle('gifts', g.id, 3)}><span className="gx">{on ? '✓' : '+'}</span>{g.label}</button>; })}
          </div>
          {giftsFull && <p className="hint muted" style={{fontSize:14}}>You’ve chosen three. Tap one to swap it out.</p>}
        </div>);
      case 3: return (
        <div className="step">
          <div className="step-head"><p className="eyebrow">Question 4</p><h2>What skills, experience, or interests would you like to share?</h2><p className="hint">Short answer. Jobs, hobbies, training, anything that might help us find your fit.</p></div>
          <div className="field">
            <label htmlFor="f-skills">Your answer <span>(optional)</span></label>
            <textarea id="f-skills" className="input" maxLength={500} value={a.skills} onChange={e => set({skills:e.target.value})} placeholder="For example: I’m a nurse, I love to cook, I’ve run sound at my school…"/>
            <span className="muted tabular" style={{fontSize:12.5,justifySelf:'end'}}>{a.skills.length}/500</span>
          </div>
          <div className="sugs">{['I love to cook','I play keys','I’m good with kids','I work in IT','I enjoy photography','I’m handy with repairs'].map(s =>
            <button key={s} type="button" className="sug" onClick={() => set({ skills: (a.skills ? a.skills.replace(/\s*$/,'') + (/[.!?]$/.test(a.skills.trim())?' ':'. ') : '') + s + '.' })}>+ {s}</button>)}</div>
        </div>);
      case 4: return (
        <div className="step">
          <div className="step-head"><p className="eyebrow">Question 5</p><h2>Which CU ministries would you like to explore?</h2><p className="hint">Select all that apply. <span className="counter">{a.ministries.length} selected</span></p></div>
          <div className="grid-2" role="group" aria-label="Ministries">
            {MINISTRIES.map((m,i) => (
              <button key={m.id} type="button" role="checkbox" aria-checked={a.ministries.includes(m.id)} className="opt" style={{animationDelay:i*.03+'s'}} onClick={() => toggle('ministries', m.id)}>
                <Check/><span className="opt-text">{m.label}{m.id==='fit' && <small>We’ll suggest teams from your answers</small>}</span>
              </button>))}
          </div>
        </div>);
      case 5: return (
        <div className="step">
          <div className="step-head"><p className="eyebrow">Question 6</p><h2>How often could you serve?</h2><p className="hint">Choose one. You can always change this later.</p></div>
          <div className="freq" role="radiogroup" aria-label="How often">
            {FREQ.map((f,i) => (
              <button key={f.id} type="button" role="radio" aria-checked={a.freq===f.id} className="opt" style={{animationDelay:i*.04+'s'}} onClick={() => set({freq:f.id})}>
                <span className="cal" aria-hidden="true">{Array.from({length:28}).map((_,d) => <i key={d} className={f.cal.includes(d) ? 'on' : f.cal.includes('s'+d) ? 'star' : ''}/>)}</span>
                <span style={{display:'flex',gap:10,alignItems:'center'}}><Check round/><span className="opt-text"><b style={{fontWeight:600}}>{f.label}</b></span></span>
              </button>))}
          </div>
        </div>);
      case 6: return (
        <div className="step">
          <div className="step-head"><p className="eyebrow">Question 7</p><h2>Would you like someone to help you explore your gifts and find a place to serve?</h2></div>
          <div className="yn" role="radiogroup" aria-label="Follow-up">
            <button type="button" role="radio" aria-checked={a.followUp==='yes'} className="opt" onClick={() => set({followUp:'yes'})}><Check round/><b>Yes</b><span className="opt-text"><small>Someone from CU will reach out to help with your next step.</small></span></button>
            <button type="button" role="radio" aria-checked={a.followUp==='no'} className="opt" onClick={() => set({followUp:'no'})}><Check round/><b>No</b><span className="opt-text"><small>I’ll explore on my own for now.</small></span></button>
          </div>
        </div>);
    }
  };

  return (
    <div className="page">
      <div className="wrap wizard-head">
        <p className="eyebrow">Start MySteps</p>
        <h1>Discover Your Gifts & Find Your Place</h1>
        <p>God has given you gifts to serve others. Tell us what you enjoy, what you do well, and which ministries you’d like to explore. We’ll help you find a place to serve at Central Union.</p>
      </div>
      <div className="wrap wizard">
        <aside className="timeline" aria-label="Progress">
          <p className="tl-title"><span>Your steps</span><span className="tabular">{Math.round(progress*100)}%</span></p>
          <div style={{position:'relative'}}>
          <div className="tl-rail"><div className="tl-fill" style={{height:(progress*100)+'%'}}/></div>
          <ol className="tl">
            {STEPS.map((s,i) => {
              const state = i===step ? 'current' : i <= maxStep ? 'done' : 'upcoming';
              return (
                <li key={s.key} className={state}>
                  <button type="button" disabled={i > maxStep || i===step} onClick={() => goTo(i)} aria-current={i===step ? 'step' : undefined}>
                    <span className="tl-node">{state==='done' ? I.check : i+1}</span>
                    <span className="tl-text"><b>{s.label}</b><small>{summary(i,a)}</small></span>
                  </button>
                </li>);
            })}
          </ol>
          </div>
          <p className="tl-foot">{I.lock}Your answers stay on this device until you submit.</p>
        </aside>
        <section className="panel" ref={stageRef} onKeyDown={onKey}>
          <div className="mprog">
            <div className="mprog-bar"><i style={{width:((step+1)/STEPS.length*100)+'%'}}/></div>
            <div className="mprog-row"><span>{STEPS[step].label}</span><span className="tabular">Step {step+1} of {STEPS.length}</span></div>
          </div>
          <div className="stage">
            <div key={step} className={dir > 0 ? 'in-fwd' : 'in-back'}>{body()}</div>
            {errors.form && <p className="err" role="alert" style={{marginTop:16}}>{errors.form}</p>}
          </div>
          <footer className="pager">
            <button className="btn btn-ghost" onClick={back} disabled={step===0}>{I.back}Back</button>
            <span className="count">{String(step+1).padStart(2,'0')} / {String(STEPS.length).padStart(2,'0')}</span>
            <span className="dots" aria-hidden="true">{STEPS.map((_,i) => <i key={i} className={i===step ? 'on' : i<=maxStep ? 'done' : ''}/>)}</span>
            <button className="btn btn-primary" onClick={next}>{step===STEPS.length-1 ? 'Submit' : 'Next'}{I.arrow}</button>
          </footer>
        </section>
      </div>
    </div>
  );
}

/* ───────────────────────── Confirmation & evaluation ───────────────────────── */
/* Sends a submission to CU's server, which files it in Planning Center. Off when no endpoint is configured (e.g. the Claude preview). */
function buildPayload(a, p){
  return {
    answers: {
      name:a.name, email:a.email, phone:a.phone, hp:a.hp||'', skills:a.skills,
      enjoy:a.enjoy.map(e => ENJOY_MAP[e].label), gifts:a.gifts.map(g => GIFT_MAP[g].label),
      ministries:a.ministries.map(m => MIN_MAP[m].label), freq:FREQ_MAP[a.freq].label, followUp:a.followUp,
      ids: { enjoy:a.enjoy, gifts:a.gifts, ministries:a.ministries, freq:a.freq },
    },
    matches: p.results.slice(0,3).map(r => ({ name:r.name, pct:r.pct })),
  };
}
async function sendSubmission(payload){
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 25000);
  try {
    const r = await fetch(window.MYSTEPS_API, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload), signal:ctrl.signal });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || `The server answered with an error (${r.status}).`);
    return d;
  } catch(e){ throw new Error(e.name==='AbortError' ? 'The connection timed out.' : e.message); }
  finally { clearTimeout(timer); }
}
function SyncNote({ sync, onRetry }){
  if (!sync || sync.state==='off') return null;
  if (sync.state==='sending') return <p className="sync">Sending your answers to Central Union…</p>;
  if (sync.state==='sent') return <p className="sync ok">{I.check}Your answers were sent to Central Union.</p>;
  return (
    <div className="sync bad" role="alert">
      <span>Your answers didn’t reach CU yet. {sync.message}</span>
      <button className="btn btn-ghost btn-sm" onClick={onRetry}>Try again</button>
    </div>
  );
}

function Confirm({ answers, onContinue, sync, onRetry }){
  useEffect(() => { const t = setTimeout(onContinue, 5000); return () => clearTimeout(t); }, []);
  return (
    <div className="center-stage wrap page">
      <div className="confirm">
        <svg className="check" viewBox="0 0 104 104" aria-hidden="true"><circle cx="52" cy="52" r="48"/><path d="M32 54l14 14 27-30"/></svg>
        <p className="eyebrow">Submitted</p>
        <h1>Thank you, {answers.name.split(' ')[0]}!</h1>
        <p>Thank you for sharing your gifts and interests with us! If you requested follow-up, someone from CU will reach out to help you explore your next step.</p>
        <SyncNote sync={sync} onRetry={onRetry}/>
        <div className="autobar" aria-hidden="true"><i/></div>
        <button className="btn btn-ghost" onClick={onContinue}>Build my serving profile now {I.arrow}</button>
      </div>
    </div>
  );
}

const PHASES = ['Reading what you enjoy','Weighing your spiritual gifts','Matching your skills and interests',`Comparing ${TEAMS.length} CU teams`,'Shaping your serving profile'];
const DURATION = 12500;
function Evaluating({ answers, onDone }){
  const [t, setT] = useState(0);
  const done = useRef(onDone); done.current = onDone;
  useEffect(() => {
    let raf, start = performance.now();
    const tick = (now) => { const e = now - start; setT(Math.min(1, e/DURATION)); if (e < DURATION) raf = requestAnimationFrame(tick); else done.current(); };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);
  const idx = Math.min(PHASES.length-1, Math.floor(t * PHASES.length));
  const chipsA = answers.enjoy.slice(0,4).map(e => ENJOY_MAP[e].short);
  const chipsB = [...answers.gifts.map(g => GIFT_MAP[g].label.replace('I’m still discovering my gifts','Discovering')), ...answers.ministries.slice(0,2).map(m => MIN_MAP[m].label)].slice(0,4);
  const C = 2*Math.PI*46;
  const team = TEAMS[Math.floor(t*140) % TEAMS.length].name;
  const sparks = useMemo(() => Array.from({length:22}).map((_,i) => ({ left: Math.random()*100, delay: Math.random()*7, dur: 5+Math.random()*5 })), []);
  return (
    <div className="center-stage page">
      <div className="sparks" aria-hidden="true">{sparks.map((s,i) => <i key={i} style={{left:s.left+'%',animationDelay:s.delay+'s',animationDuration:s.dur+'s'}}/>)}</div>
      <div className="eval wrap" role="status" aria-live="polite">
        <p className="eyebrow">MySteps is evaluating</p>
        <div className="orb">
          <svg className="ring" viewBox="0 0 100 100"><defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="var(--btn)"/><stop offset="1" stopColor="var(--accent)"/></linearGradient></defs>
            <circle className="ring-bg" cx="50" cy="50" r="46"/><circle className="ring-fg" cx="50" cy="50" r="46" strokeDasharray={C} strokeDashoffset={C*(1-t)}/></svg>
          <div className="orbit">{chipsA.map((label,i) => { const ang=(i/Math.max(1,chipsA.length))*Math.PI*2 - Math.PI/2; return <span className="cp" key={label} style={{left:`${50+Math.cos(ang)*50}%`,top:`${50+Math.sin(ang)*50}%`}}><span>{label}</span></span>; })}</div>
          <div className="orbit rev">{chipsB.map((label,i) => { const ang=(i/Math.max(1,chipsB.length))*Math.PI*2; return <span className="cp" key={label} style={{left:`${50+Math.cos(ang)*50}%`,top:`${50+Math.sin(ang)*50}%`}}><span>{label}</span></span>; })}</div>
          <div className="orb-core"><div style={{textAlign:'center'}}><strong>{Math.round(t*100)}%</strong><small>Evaluating</small></div></div>
        </div>
        <div className="phase"><span key={idx} className="phase-swap">{PHASES[idx]}…</span></div>
        <p className="ticker">Checking <b>{team}</b></p>
        <div className="phase-list">{PHASES.map((p,i) => <span key={p} className={i<idx ? 'done' : i===idx ? 'now' : ''}>{p}</span>)}</div>
      </div>
    </div>
  );
}

/* ───────────────────────── Profile ───────────────────────── */
function Dial({ pct }){
  const [v, setV] = useState(0); const C = 2*Math.PI*30;
  useEffect(() => { const id = requestAnimationFrame(() => setV(pct)); return () => cancelAnimationFrame(id); }, [pct]);
  const shown = useCount(pct);
  return (<div className="dial"><svg viewBox="0 0 72 72"><circle className="bg" cx="36" cy="36" r="30"/><circle className="fg" cx="36" cy="36" r="30" strokeDasharray={C} strokeDashoffset={C*(1-v/100)}/></svg><b>{shown}%</b></div>);
}
function useCount(target, ms=1400){
  const [n, setN] = useState(0);
  useEffect(() => { let raf, s = performance.now(); const f = (now) => { const p = Math.min(1,(now-s)/ms); setN(Math.round(target*(1-Math.pow(1-p,3)))); if (p<1) raf = requestAnimationFrame(f); }; raf = requestAnimationFrame(f); return () => cancelAnimationFrame(raf); }, [target]);
  return n;
}
const art = (w) => /^[aeiou]/i.test(w) ? 'an' : 'a';
const reasonText = (why) => why.length ? 'Matches ' + joinList(why.slice(0,3)) + '.' : 'A welcoming place to start while you discover your gifts.';

/* Find a saved profile by email (works on any device once MySteps is hosted). */
function FindProfile({ onFound }){
  const [email, setEmail] = useState('');
  const [st, setSt] = useState({ s:'idle' });
  const submit = async (e) => {
    e.preventDefault();
    if (!emailOk(email)) { setSt({ s:'error', msg:'Enter the email you used, like name@example.com.' }); return; }
    setSt({ s:'loading' });
    try {
      const r = await fetch(window.MYSTEPS_PROFILE_API, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ email }) });
      const d = await r.json().catch(() => ({}));
      if (r.status===404) { setSt({ s:'missing' }); return; }
      if (!r.ok) throw new Error(d.error || 'Something went wrong. Please try again.');
      onFound(d);
    } catch(err){ setSt({ s:'error', msg: err.message }); }
  };
  return (
    <form className="finder" onSubmit={submit} noValidate>
      <div className="finder-text">
        <p className="eyebrow">Welcome back</p>
        <h3>Already took MySteps? Find your profile.</h3>
        <p className="muted">Enter the email you used when you took MySteps.</p>
      </div>
      <div className="finder-row">
        <label htmlFor="find-email" className="sr">Email</label>
        <input id="find-email" type="email" className={'input'+(st.s==='error'?' bad':'')} autoComplete="email" placeholder="name@example.com" value={email} onChange={e => { setEmail(e.target.value); if (st.s!=='loading') setSt({ s:'idle' }); }}/>
        <button className="btn btn-primary" type="submit" disabled={st.s==='loading'}>{st.s==='loading' ? 'Finding…' : 'Find my profile'}</button>
      </div>
      {st.s==='missing' && <p className="finder-msg">We couldn’t find a MySteps profile for that email. Check the spelling, or <a href="#start">take MySteps</a> now.</p>}
      {st.s==='error' && <p className="finder-msg err" role="alert">{st.msg}</p>}
    </form>
  );
}

function Profile({ profile, sync, onRetry, onFound, onClear }){
  const example = !profile;
  const data = profile || buildProfile(SAMPLE_ANSWERS);
  const a = data.answers;
  const shape = computeShape(a);
  const ranked = [...shape].sort((x,y) => y.value - x.value);
  const first = a.name.trim().split(' ')[0] || 'Friend';
  const top = data.results.slice(0,3), more = data.results.slice(3,9);
  const date = new Date(data.date).toLocaleDateString(undefined, { month:'long', day:'numeric', year:'numeric' });
  const allDiscovering = a.gifts.includes('discovering');
  return (
    <div className="page">
      <section className="p-hero">
        <Scene kind="stars" seed={9}/><div className="shade"/>
        <div className="wrap p-hero-in">
          <p className="eyebrow rise">MySteps Serving Profile {example ? <span className="badge">EXAMPLE</span> : <span className="badge">{date.toUpperCase()}</span>}</p>
          <h1 className="rise" style={{animationDelay:'.08s'}}>{first}, you’re {art(ranked[0].title)} <span>{ranked[0].title}</span> with {art(ranked[1].title)} {ranked[1].title.toLowerCase()}’s heart.</h1>
          <p className="rise" style={{animationDelay:'.16s'}}>{example ? 'This is a sample profile so you can see what MySteps creates. Take MySteps to get your own.' : `Your best fit right now is ${top[0].name}. Here’s why, plus other teams worth exploring.`}</p>
          <div className="shape-tags rise" style={{animationDelay:'.24s'}}>{ranked.slice(0,3).map(d => <span key={d.id}>{d.label} · {d.value}</span>)}</div>
        </div>
      </section>

      <section className="section wrap stagger" style={{display:'grid',gap:36}}>
        {example && window.MYSTEPS_PROFILE_API && <FindProfile onFound={onFound}/>}
        {!example && sync && (sync.state==='error' || sync.state==='sending') && <SyncNote sync={sync} onRetry={onRetry}/>}
        <div className="p-grid">
          <div className="pcard">
            <div><p className="eyebrow">Your serving shape</p><h3 style={{marginTop:6}}>Where your gifts and passions point</h3></div>
            <div className="bars">{shape.map((d,i) => (
              <div className="bar-row" key={d.id}><b>{d.label}</b><div className="bar"><i style={{width:d.value+'%',animationDelay:(.2+i*.1)+'s'}}/></div><span className="v">{d.value}</span></div>))}</div>
            <p className="muted" style={{fontSize:13.5}}>Scores are relative to your strongest area (100).</p>
          </div>
          <div className="pcard">
            <div><p className="eyebrow">What you shared</p><h3 style={{marginTop:6}}>{a.name}</h3></div>
            <dl className="kv" style={{margin:0}}>
              <div><dt>You enjoy</dt><dd>{a.enjoy.map(e => <span key={e} className="tag">{ENJOY_MAP[e].short}</span>)}</dd></div>
              <div><dt>Spiritual gifts</dt><dd>{a.gifts.map(g => <span key={g} className="tag gold">{GIFT_MAP[g].label}</span>)}</dd></div>
              <div><dt>Exploring</dt><dd>{a.ministries.map(m => <span key={m} className="tag">{MIN_MAP[m].label}</span>)}</dd></div>
              <div><dt>Availability</dt><dd><span className="tag">{FREQ_MAP[a.freq].label}</span><span className="tag">{a.followUp==='yes' ? 'Follow-up requested' : 'No follow-up requested'}</span></dd></div>
              {a.skills && <div><dt>Skills & interests</dt><dd><span className="muted" style={{fontSize:14.5}}>“{a.skills}”</span></dd></div>}
            </dl>
          </div>
        </div>

        <div>
          <div className="section-head"><div><p className="eyebrow">MySteps recommends</p><h2>Your best places to serve</h2></div></div>
          <div className="matches">
            {top.map((m,i) => (
              <article key={m.name} className={'match'+(i===0?' first':'')}>
                <div className="match-top"><div><span className="rank">{i===0 ? 'Best fit' : `Fit #${i+1}`}</span><h3>{m.name}</h3></div><Dial pct={m.pct}/></div>
                <span className={'type '+typeClass(m.type)} style={{justifySelf:'start'}}>{m.type}</span>
                <p>{m.blurb}</p>
                <div className="why"><b>Why it fits</b>{reasonText(m.why)}</div>
              </article>))}
          </div>
        </div>

        <div>
          <div className="section-head"><div><p className="eyebrow">Also worth exploring</p><h2>More teams that fit you</h2></div><a className="btn btn-ghost" href="#teams">See all {TEAMS.length} teams {I.arrow}</a></div>
          <div className="more">{more.map(m => (
            <div className="more-item" key={m.name}><span className="pct">{m.pct}%</span><div><b>{m.name}</b><small>{m.area} · {m.type}</small></div></div>))}</div>
        </div>

        <div className="next">
          <div>
            <h3>{a.followUp==='yes' ? 'Someone from CU will reach out.' : 'Your next step is ready when you are.'}</h3>
            <p>{a.followUp==='yes' ? `A CU leader will contact you${a.email ? ' at ' + a.email : ''} to help you explore ${top[0].name} and your other matches.` : `Visit the Connections Team on Sunday or talk with the leader of ${top[0].name} to take your first step.`}{allDiscovering ? ' Still discovering your gifts? Serving is one of the best ways to find them.' : ''}</p>
          </div>
          <div className="btns">
            <a className="btn btn-primary" href="#start">{example ? 'Start MySteps' : 'Retake MySteps'} {I.arrow}</a>
            {!example && <button className="btn btn-ghost" onClick={onClear} title="Removes this profile from this device only">Not {first}? Clear from this device</button>}
          </div>
        </div>
      </section>
    </div>
  );
}

/* ───────────────────────── Start flow ───────────────────────── */
function Start({ onComplete, sync, onRetry }){
  const [phase, setPhase] = useState('form');
  const [answers, setAnswers] = useState(null);
  useEffect(() => { window.scrollTo({ top:0 }); }, [phase]);
  if (phase==='form') return <Wizard onSubmit={(a) => { setAnswers(a); onComplete(a, false); setPhase('confirm'); }}/>;
  if (phase==='confirm') return <Confirm answers={answers} onContinue={() => setPhase('eval')} sync={sync} onRetry={onRetry}/>;
  return <Evaluating answers={answers} onDone={() => onComplete(answers, true)}/>;
}

/* ───────────────────────── App ───────────────────────── */
function App(){
  const [route, setRoute] = useState(readRoute());
  const [theme, toggle] = useTheme();
  const [profile, setProfile] = useState(() => store.get('mysteps.profile'));
  const [startKey, setStartKey] = useState(0);
  useEffect(() => {
    const f = () => { const r = readRoute(); setRoute(r); if (r==='start') setStartKey(k => k+1); window.scrollTo({ top:0 }); };
    window.addEventListener('hashchange', f); return () => window.removeEventListener('hashchange', f);
  }, []);
  const [sync, setSync] = useState(null);
  const lastPayload = useRef(null);
  const send = async (payload) => {
    if (!window.MYSTEPS_API) { setSync({ state:'off' }); return; }
    lastPayload.current = payload;
    setSync({ state:'sending' });
    try { await sendSubmission(payload); setSync({ state:'sent' }); }
    catch(e){ setSync({ state:'error', message:e.message }); }
  };
  const retry = () => lastPayload.current && send(lastPayload.current);
  const complete = (a, show) => {
    if (!show) {
      const p = buildProfile(a);
      const { hp, ...kept } = p.answers; p.answers = kept;
      store.set('mysteps.profile', p); setProfile(p);
      send(buildPayload(a, p));
      return;
    }
    location.hash = 'profile';
  };
  const found = (d) => {
    const a = { ...EMPTY, ...SAMPLE_ANSWERS, ...d.answers, name: d.firstName || 'Friend', email:'', phone:'' };
    ['enjoy','gifts','ministries'].forEach(k => { a[k] = (a[k] || []).filter(x => k==='enjoy' ? ENJOY_MAP[x] : k==='gifts' ? GIFT_MAP[x] : MIN_MAP[x]); });
    if (!FREQ_MAP[a.freq]) a.freq = 'unsure';
    const p = buildProfile(a); p.date = d.date || p.date;
    const { hp, ...kept } = p.answers; p.answers = kept;
    store.set('mysteps.profile', p); setProfile(p); setSync(null);
    window.scrollTo({ top:0, behavior:'smooth' });
  };
  const clearProfile = () => { store.del('mysteps.profile'); setProfile(null); setSync(null); window.scrollTo({ top:0, behavior:'smooth' }); };
  let view;
  if (route==='about') view = <About/>;
  else if (route==='teams') view = <Teams profile={profile}/>;
  else if (route==='profile') view = <Profile profile={profile} sync={sync} onRetry={retry} onFound={found} onClear={clearProfile}/>;
  else if (route==='start') view = <Start key={startKey} onComplete={complete} sync={sync} onRetry={retry}/>;
  else view = <Home profile={profile}/>;
  return (
    <>
      <Header route={route} theme={theme} toggle={toggle}/>
      <main key={route}>{view}</main>
      <footer className="site"><div className="wrap"><span>MySteps · Central Union</span><span>Know where you are. See what’s next. Grow.</span><span>Photos: Unsplash</span></div></footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
